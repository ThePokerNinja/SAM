# S.A.M. Phase 0 - voice.michaelstewman.com portal + token server + LiveKit agent worker.
#
# First-time setup (Render dashboard):
#   1. New -> Blueprint -> connect ThePokerNinja/SAM -> Apply
#   2. Set sync:false secrets on sam-token + sam-agent (see deploy/README.md)
#   3. Custom domain voice.michaelstewman.com on sam-voice-portal
#   4. Re-deploy sam-voice-portal after sam-token is live (VITE_TOKEN_URL linkage)

services:
  # Mints LiveKit join tokens for the browser client.
  - type: web
    name: sam-token
    runtime: python
    rootDir: worker
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.token_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: SAM_ALLOWED_ORIGINS
        value: https://voice.michaelstewman.com
      - key: SAM_PORTAL_ACCESS_KEY
        sync: false
      - key: SAM_PORTAL_GOOGLE_REQUIRED
        value: "1"
      - key: RM_API_BASE_URL
        value: https://rainmaker-api-waqs.onrender.com

  # Static React portal (candle intro + voice UI). Custom domain: voice.michaelstewman.com
  - type: web
    name: sam-voice-portal
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_TOKEN_URL
        fromService:
          type: web
          name: sam-token
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_RM_API_BASE_URL
        value: https://rainmaker-api-waqs.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # LiveKit Agents worker - auto-dispatches Samuel into rooms the portal creates.
  - type: pserv
    name: sam-agent
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: standard
    region: oregon
    maxShutdownDelaySeconds: 300
    disk:
      name: sam-agent-data
      mountPath: /var/data
      sizeGB: 1
    # No scaling block - autoscaling requires a paid workspace (not Hobby).
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_FALLBACK_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_TPM_BUDGET
        value: "8000"
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_BASE_URL
        value: https://api.cerebras.ai/v1
      - key: CEREBRAS_MODEL
        value: gpt-oss-120b
      - key: SAM_LLM_MAX_COMPLETION_TOKENS
        value: "512"
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_MODEL
        value: eleven_flash_v2_5
      - key: SAM_VOICE_ID
        sync: false
      - key: SAM_STT_MODEL
        value: deepgram/nova-3
      - key: SAM_PHONE_STT_MODEL
        value: deepgram/nova-2-phonecall
      - key: SAM_TURN_MODE
        value: stt
      - key: SAM_PREEMPTIVE_TTS
        value: "1"
      - key: SAM_LATENCY_LOG
        value: "1"
      - key: SAM_MEMORY_ENABLED
        value: "1"
      - key: SAM_CACHE_DIR
        value: /var/data
      - key: SAM_INTERRUPT_MIN_DURATION
        value: "0.25"
      - key: SAM_INTERRUPT_MIN_WORDS
        value: "1"
      - key: SAM_INTERRUPTION_MODE
        value: vad
      - key: SAM_ENDPOINTING_MIN
        value: "0.25"
      - key: SAM_ENDPOINTING_MAX
        value: "0.6"
      - key: SAM_HISTORY_TOKEN_CAP
        value: "250"
      - key: SAM_OWNER_HISTORY_TOKEN_CAP
        value: "6000"
      - key: SAM_OWNER_MEMORY_TOKEN_CAP
        value: "1200"
      - key: SAM_PROMPT_TOOL_MODE
        value: dynamic
      # SAM-075: the Pythia calibration job runs in this process because the
      # forecast ledger lives on this service's disk. Code defaults match these,
      # so an unset dashboard key still behaves as written here.
      - key: SAM_NIGHTLY_ENABLED
        value: "1"
      - key: SAM_NIGHTLY_HOUR_UTC
        value: "9"
      # Same workspace + Oregon region: keep Samuel's command traffic on
      # Render's private network. config.py adds the http:// scheme.
      - key: RM_API_HOSTPORT
        fromService:
          type: web
          name: rainmaker-api
          property: hostport
      # SAM-003: same secret as RM_CRON_TOKEN on the rainmaker-api Render service.
      # Copy the value from Render → rainmaker-api → Environment → RM_CRON_TOKEN.
      - key: RM_API_TOKEN
        sync: false
      # Wave 8.4: prompt/history caps keep gpt-oss-20b inside the 8K TPM owner pilot.
      - key: OPENAI_API_KEY
        sync: false
      - key: SAM_BRAIN
        value: openai
      # Owner voice verification (Tier-T gate). Both must be set to arm the voice gate;
      # otherwise Tier-T falls back to the portal access-key owner attribute.
      - key: PICOVOICE_ACCESS_KEY
        sync: false
      - key: SAM_OWNER_VOICEPRINT
        sync: false
      # Defense in depth behind LiveKit inbound-trunk allowedNumbers.
      - key: SAM_SIP_OWNER_NUMBERS
        sync: false
